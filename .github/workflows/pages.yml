name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://surajpandey727-afk.github.io/Nishaan-a
          NEXT_PUBLIC_SUPABASE_URL: https://azusdzavsukgaxxmvlaw.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vWzFh7jlIz8D6TzFuti7fg_ySboWUiN
          NEXT_PUBLIC_ADMIN_DASHBOARD_KEY: nishaan-admin-2026
      - name: Prepare GitHub Pages artifact
        run: touch ./out/.nojekyll && ls -la && ls -la out || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
